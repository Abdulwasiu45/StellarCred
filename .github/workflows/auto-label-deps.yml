name: Auto-label dependency PRs

on:
  pull_request:
    branches: [main]
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - '**/yarn.lock'
      - '**/Cargo.lock'
      - '**/requirements.txt'

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label dependency update PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read dependency PR criteria
        id: criteria
        run: |
          LABEL="${{ github.event.pull_request.user.login }}"
          if [ "${LABEL}" = "dependabot[bot]" ] || [ "${LABEL}" = "renovate[bot]" ] || [ "${LABEL}" = "github-actions[bot]" ]; then
            LABEL="dependabot"
          fi
          echo "source=${LABEL}" >> "$GITHUB_OUTPUT"

      - name: Label PR
        if: steps.criteria.outputs.source != ''
        run: |
          LABEL="${{ steps.criteria.outputs.source }}"
          if [ -z "${LABEL}" ]; then
            echo "No dependency signal found"
            exit 0
          fi
          gh pr edit --add-label "${LABEL}" "${PR_NUMBER}" || \
          gh pr comment --body "Auto-labeling skipped: could not add label '${LABEL}'." || true

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
